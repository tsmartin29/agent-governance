[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance"
version = "0.1.0"
description = "Ten rules for governing AI agents, each enforced by a mechanism: signed goals, honest ledgers, earned autonomy, never-sealed agent spaces, plus a CPU guard and a one-worker hook for Claude Code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Thomas Martin" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/tsmartin29/agent-governance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
